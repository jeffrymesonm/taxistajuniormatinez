            - generic "5 out of 5" [ref=f17e377]
            - paragraph [ref=f17e388]: Viajo a Cabarete dos veces al año con dos tablas de kite y un bulto de equipo. A Junior nunca le molesta el equipaje, siempre confirma el precio por WhatsApp la noche antes y está afuera del apartamento antes de que termine mi café.
