            - generic "5 out of 5" [ref=f17e425]
            - paragraph [ref=f17e436]: Administro una villa en Sea Horse Ranch y mando a todos mis huéspedes con Junior. En tres temporadas no ha llegado tarde ni una vez, y ni un solo huésped me ha reclamado por el precio. Por eso lo sigo usando.
