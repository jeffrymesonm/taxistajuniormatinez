            - paragraph [ref=f17e372]: Nuestro vuelo a POP llegó dos horas tarde y yo ya me veía tirado en el aeropuerto. Junior estaba ahí con el cartel, tranquilísimo, y no cobró un peso de más. Carro fresco, buena conversación, y en la villa de Sosúa en quince minutos.
