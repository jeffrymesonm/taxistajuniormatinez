            - generic "5 out of 5" [ref=f17e409]
            - paragraph [ref=f17e420]: Contratamos a Junior un día completo para Damajagua y después Puerto Plata. Esperó en cada parada, nos recomendó un lugar para almorzar que jamás habríamos encontrado, y el total fue el número que acordamos esa mañana. Lo usamos cuatro veces más esa semana.
